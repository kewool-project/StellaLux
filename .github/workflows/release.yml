name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (blank = build only)"
        required: false
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --win nsis:x64
          - platform: macos
            os: macos-15-intel
            args: --mac --universal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check release version
        run: |
          node --check main.js
          node -e 'const v = require("./package.json").version; if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== `v${v}`) throw new Error(`Tag must be v${v}`);'

      - name: Install dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive

      - name: Build installers and update files
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: yarn electron-builder ${{ matrix.args }} --publish never

      - name: Upload build files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-mac.yml

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Match GitHub release filenames
        shell: bash
        run: |
          for file in release-assets/*; do
            normalized="${file// /-}"
            if [ "$file" != "$normalized" ]; then
              mv -- "$file" "$normalized"
            fi
          done

      - name: Check release files
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          for file in \
            "StellaLux-Setup-${version}.exe" \
            "StellaLux-Setup-${version}.exe.blockmap" \
            "StellaLux-${version}-universal.dmg" \
            "StellaLux-${version}-universal.dmg.blockmap" \
            "StellaLux-${version}-universal-mac.zip" \
            "StellaLux-${version}-universal-mac.zip.blockmap" \
            latest.yml latest-mac.yml; do
            test -s "release-assets/$file" || { echo "Missing release file: $file"; exit 1; }
          done

      - name: Upload and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if ! jq -e '.isDraft' release.json > /dev/null; then
              echo "Release is already published; refusing to replace its files."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
